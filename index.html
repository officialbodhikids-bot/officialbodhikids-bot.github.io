<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiB Tara | Children's Books Store</title>
    <style>
        /* COLOR CONFIGURATIONS & THEME ARCHITECTURE */
        :root {
            --astra-dark: #1f2937;
            --astra-muted: #6b7280;
            --astra-link: #4f46e5;
            --whatsapp-green: #25d366;
            --whatsapp-hover: #20ba5a;
            --bg-canvas: #ffffff;
            --border-tint: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--astra-dark);
            line-height: 1.6;
        }

        /* NAVIGATION HEADER */
        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border-tint);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-box {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            background-color: #4b5563;
            padding: 6px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-style: italic;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--astra-dark);
            font-weight: 500;
            font-size: 15px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--astra-link);
        }

        /* HERO BOOK BANNER ARRANGEMENT */
        .hero-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .hero-section {
                grid-template-columns: 1.1fr 0.9fr;
            }
        }

        .hero-details {
            display: flex;
            flex-direction: flex-col;
            justify-content: center;
            display: flex;
            flex-direction: column;
        }

        .tag-release {
            color: #6366f1;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .hero-title {
            font-size: 42px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 25px;
            color: #111827;
        }

        .hero-description {
            font-size: 16px;
            color: var(--astra-muted);
            margin-bottom: 35px;
            max-width: 500px;
        }

        .action-tray {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            border: none;
        }

        .btn-primary {
            background-color: var(--astra-link);
            color: white;
        }

        .btn-primary:hover {
            background-color: #4338ca;
        }

        .btn-whatsapp {
            background-color: var(--whatsapp-green);
            color: white;
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-hover);
        }

        /* DISPLAY ILLUSTRATION FRAMEWORK */
        .showcase-frame {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f9fafb;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border-tint);
        }

        .showcase-frame img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* EXTREME BASE FOOTER ELEMENT */
        footer {
            border-top: 1px solid var(--border-tint);
            padding: 30px 20px;
            text-align: center;
            margin-top: 60px;
            color: var(--astra-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- SITE BAR MENU HEADER -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo-box">KiB Tana</a>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#books">Books</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </header>

    <!-- CONTENT DISPLAY ZONE -->
    <main id="books" class="hero-section">
        
        <!-- TEXT CONTENT WRAPPER CONTAINER (EDIT DETAILS HERE) -->
        <div class="hero-details">
            <div class="tag-release" id="meta-tag">NEW RELEASE</div>
            
            <!-- Book Title Placeholder -->
            <h1 class="hero-title" id="book-title">செய்வதே மகிழ்ச்சி</h1>
            
            <!-- Book Description Summary Placeholder -->
            <p class="hero-description" id="book-desc">
                செய்யும் ஒவ்வொரு செயலிலும் மகிழ்ச்சியைக் காண்பது எப்படி என்பதை குழந்தைகளுக்கு கற்றுத்தரும் ஓர் அழகான கதைப் புத்தகம்.
            </p>
            
            <!-- Dynamic Cost Factor Badge -->
            <div style="font-size: 22px; font-weight: bold; margin-bottom: 25px; color: #111827;">
                Price: <span id="book-price">₹299</span>
            </div>

            <!-- Operational Control Action Links Buttons Chassis -->
            <div class="action-tray">
                <button onclick="launchWhatsAppOrder()" class="btn btn-whatsapp">💬 Buy Now / Order on WhatsApp</button>
                <a href="https://wa.me" target="_blank" class="btn btn-primary" style="background-color: #f3f4f6; color: #374151;">Read Sample</a>
            </div>
        </div>

        <!-- RIGHT SIDE GRAPHIC BOX HOLDER (IMAGE PLACEHOLDER) -->
        <div class="showcase-frame">
            <!-- Replace 'cover.jpg' with your real uploaded laptop image filename -->
            <img id="book-image" src="cover.jpg" alt="KiB Tara Book Cover Layer">
        </div>

    </main>

    <!-- FOOTER ARCHITECTURE ELEMENT -->
    <footer id="contact">
        <p>&copy; 2026 KiB Tara Books Store. All Rights Reserved. Author Channel Connection.</p>
    </footer>

    <!-- INVENTORY CONTROL LOGICAL SCRIPT STRINGS -->
    <script>
        /*******************************************************************************
         * ⚙️ LAPTOP DIRECT DICTIONARY CONFIGURATIONS
         * Edit the variables below right from your laptop text editor to update your page!
         *******************************************************************************/
        
        const SELLER_WHATSAPP_NUMBER = "918870227915"; // Your business routing phone
        
        // This structural template fields maps strings variables output rules straight into DOM
        const ACTIVE_BOOK_DETAILS = {
            title: "செய்வதே மகிழ்ச்சி",
            price: "₹299",
            description: "செய்யும் ஒவ்வொரு செயலிலும் மகிழ்ச்சியைக் காண்பது எப்படி என்பதை குழந்தைகளுக்கு கற்றுத்தரும் ஓர் அழகான கதைப் புத்தகம்.",
            image_filename: "cover.jpg" // Upload your book cover photo to github with this exact filename
        };

        // INJECTION PIPELINES LOGICAL HANDLING DISPATCH ENGINE
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('book-title').innerText = ACTIVE_BOOK_DETAILS.title;
            document.getElementById('book-price').innerText = ACTIVE_BOOK_DETAILS.price;
            document.getElementById('book-desc').innerText = ACTIVE_BOOK_DETAILS.description;
            document.getElementById('book-image').src = ACTIVE_BOOK_DETAILS.image_filename;
        });

        // WHATSAPP LINK ASSEMBLY STRATEGY
        function launchWhatsAppOrder() {
            let messageText = `📚 *NEW BOOK ORDER - KiB Tara* 📚\n\n`;
            messageText += `Hello Mrs. Jegatha Dattani, I would like to order a copy of your children's book:\n\n`;
            messageText += `• *Book Title:* ${ACTIVE_BOOK_DETAILS.title}\n`;
            messageText += `• *Price:* ${ACTIVE_BOOK_DETAILS.price}\n\n`;
            messageText += `-----------------------------\n`;
            messageText += `✍️ *My Shipping Address Details:*\n`;
            messageText += `• Name: \n`;
            messageText += `• Full Delivery Address: \n`;
            messageText += `• Pin Code: \n\n`;
            messageText += `Please share your payment details (GPay / PhonePe / UPI) to complete my secure order. Thank you!`;

            const cleanUrlTargetString = `https://wa.me{SELLER_WHATSAPP_NUMBER}?text=${encodeURIComponent(messageText)}`;
            window.open(cleanUrlTargetString, '_blank');
        }
    </script>
</body>
</html>
