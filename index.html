<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KiB Tara | Children's Books Hub</title>
<!-- Fixed Content Pipelines Links -->
<link rel='stylesheet' id='astra-theme-css-css' href='https://jsdelivr.net' media='all' />
<style>
    :root {
        --ast-global-color-0: #5f4ecb;
        --ast-global-color-1: #4d3bc6;
        --ast-global-color-2: #25272d;
        --ast-global-color-3: #565a61;
        --ast-global-color-4: #f2f5f7;
        --ast-global-color-5: #ffffff;
        --ast-global-color-6: #f2f5f7;
        --ast-global-color-7: #424242;
        --ast-global-color-8: #000000;
        --whatsapp-green: #25D366;
    }
    body, button, input { font-family: 'Heebo', sans-serif; font-weight: 400; font-size: 16px; color: var(--ast-global-color-3); background-color: var(--ast-global-color-5); margin: 0; padding: 0; }
    h1, h2, h3 { font-family: 'EB Garamond', serif; font-weight: 600; color: var(--ast-global-color-2); margin: 0 0 15px 0; }
    
    /* Fixed Horizontal Navigation Menu System */
    .navbar-container { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: var(--ast-global-color-5); border-bottom: 1px solid #eaeaea; position: sticky; top: 0; z-index: 1000; }
    .brand-logo { font-size: 1.5rem; font-weight: 700; color: var(--ast-global-color-2); cursor: pointer; text-decoration: none; }
    .nav-links { display: flex; gap: 25px; list-style: none; margin: 0; padding: 0; align-items: center; }
    .nav-links a { font-weight: 500; font-size: 0.95rem; color: var(--ast-global-color-3); text-decoration: none; cursor: pointer; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active-tab { color: var(--ast-global-color-0); }
    
    /* Dynamic Multipage Subview Framework Rules */
    .page-view { display: none; min-height: 80vh; padding: 40px; animation: pageSlideIn 0.3s ease-out; }
    .active-view { display: block; }
    @keyframes pageSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Elegant Hero Banner Elements */
    .hero-container { display: flex; align-items: center; gap: 40px; background-color: var(--ast-global-color-4); padding: 60px; border-radius: 12px; margin-bottom: 50px; background-image: url("https://github.io"); background-position: right center; background-repeat: no-repeat; background-size: contain; }
    .hero-content { flex: 1; }
    .hero-image-box { flex: 1; text-align: center; }
    .hero-image-box img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .tagline-pill { text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; font-weight: 700; color: var(--ast-global-color-0); margin-bottom: 10px; display: block; }
    .display-title { font-size: 4.5rem; font-weight: 500; line-height: 1.1; margin-bottom: 20px; }
    
    /* Universal Button Mechanics */
    .btn-purple { background-color: var(--ast-global-color-0); color: white; padding: 14px 30px; font-weight: 600; border-radius: 4px; border: none; cursor: pointer; display: inline-block; transition: background 0.2s; text-decoration: none; }
    .btn-purple:hover { background-color: var(--ast-global-color-1); color: white; }
    .btn-outline { background-color: transparent; border: 2px solid var(--ast-global-color-0); color: var(--ast-global-color-0); padding: 12px 28px; font-weight: 600; border-radius: 4px; cursor: pointer; display: inline-block; transition: all 0.2s; text-decoration: none; }
    .btn-outline:hover { background-color: var(--ast-global-color-0); color: white; }
    .btn-whatsapp { background-color: var(--whatsapp-green); color: white; width: 100%; border: none; padding: 12px; border-radius: 4px; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; cursor: pointer; transition: background 0.2s; }
    .btn-whatsapp:hover { background-color: #20ba5a; }

    /* Product Grid & WooCommerce Card Structures */
    .section-title-wrap { text-align: center; margin-bottom: 40px; }
    .section-title-wrap h2 { font-size: 3rem; font-weight: 600; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; }
    .product-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: transform 0.2s, box-shadow 0.2s; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(0,0,0,0.06); }
    .card-thumbnail { height: 260px; background: #f8fafc; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 15px; }
    .card-thumbnail img { max-height: 100%; max-width: 100%; object-fit: contain; }
    .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-cat { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; margin-bottom: 5px; display: block; }
    .product-title { font-size: 1.15rem; font-weight: 700; color: var(--ast-global-color-2); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.7em; line-height: 1.35; }
    .price-container { margin-bottom: 15px; font-size: 1.1rem; }
    .price-del { text-decoration: line-through; color: #94a3b8; margin-right: 8px; font-size: 0.95rem; }
    .price-ins { color: var(--ast-global-color-2); font-weight: 700; }
    .sale-badge { position: absolute; top: 15px; left: 15px; background: var(--ast-global-color-0); color: white; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    /* About & Biography Column Layouts */
    .bio-container { display: flex; gap: 50px; align-items: center; padding: 60px 0; background: url("https://github.io") no-repeat left center; background-size: contain; }
    .bio-image-frame { flex: 1; text-align: center; }
    .bio-image-frame img { max-width: 80%; height: auto; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    .bio-text-frame { flex: 1.5; }
    
    /* Footer Layout Elements */
    footer { background-color: var(--ast-global-color-2); color: var(--ast-global-color-5); padding: 40px; text-align: center; margin-top: 60px; }
    .footer-links { display: flex; justify-content: center; gap: 20px; list-style: none; padding: 0; margin: 0 0 20px 0; }
    .footer-links a { color: var(--ast-global-color-5); text-decoration: none; opacity: 0.8; transition: opacity 0.2s; }
    .footer-links a:hover { opacity: 1; }
    .copyright-text { font-size: 0.85rem; opacity: 0.6; margin: 0; }

    /* Responsive Queries Fixes */
    @media (max-width: 768px) {
        .navbar-container { padding: 15px 20px; flex-direction: column; gap: 15px; }
        .hero-container, .bio-container { flex-direction: column; padding: 30px 20px; text-align: center; background-image: none; }
        .display-title { font-size: 2.5rem; }
        .nav-links { width: 100%; justify-content: center; flex-wrap: wrap; gap: 15px; }
        .bio-image-frame img { max-width: 100%; }
    }
</style>
